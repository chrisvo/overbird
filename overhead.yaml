esphome:
  name: overhead
  friendly_name: Overbird
  min_version: 2026.11.0
  includes:
    - <overhead.h>  # Declare the board types before ESPHome generates the globals.
    - overhead.h    # Copy the local header into the build.
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(poll_storage) = global_preferences->make_preference<overhead::PollSchedule>(0x3642E591);
          id(poll_storage).load(&id(poll_schedule));
      - script.execute: redraw_board

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal

logger:
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: sntp
    id: flight_clock
    timezone: UTC

http_request:
  timeout: 8s

json:

substitutions:
  radius_nm: "10"
  home_latitude: !secret home_latitude
  home_longitude: !secret home_longitude

globals:
  - id: poll_schedule
    type: overhead::PollSchedule
  - id: poll_storage
    type: esphome::ESPPreferenceObject
  - id: aircraft
    type: 'std::vector<overhead::Aircraft>'
  - id: board_view
    type: overhead::View
    initial_value: 'overhead::View::RADAR'
  - id: board_status
    type: std::string
    initial_value: '"Waiting for Wi-Fi"'

interval:
  - interval: 1s
    then:
      - if:
          condition:
            not:
              script.is_running: fetch_aircraft
          then:
            - lambda: |-
                const auto wait = [&](const char *message) {
                  if (id(board_status) == message) return;
                  id(aircraft).clear();
                  id(board_status) = message;
                  id(redraw_board).execute();
                };
                if (!wifi::global_wifi_component->is_connected()) {
                  wait("Waiting for Wi-Fi");
                  return;
                }
                const auto time = id(flight_clock).utcnow();
                if (!time.is_valid()) {
                  wait("Waiting for flight data");
                  return;
                }
                const auto now = uint64_t(time.timestamp) * 1000;
                if (id(poll_schedule).waiting_for_quota(now)) {
                  wait("Feed quota reached");
                } else if (id(poll_schedule).ready(now)) {
                  id(fetch_aircraft).execute();
                } else if (id(board_status) == "Waiting for Wi-Fi") {
                  wait("Waiting for flight data");
                }

binary_sensor:
  - platform: gpio
    id: left_button
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 35ms
    on_press:
      - lambda: id(board_view) = overhead::step_view(id(board_view), -1);
      - script.execute: redraw_board
  - platform: gpio
    id: right_button
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 35ms
    on_press:
      - lambda: id(board_view) = overhead::step_view(id(board_view), 1);
      - script.execute: redraw_board
  - platform: gpio
    id: green_button
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 35ms
    on_press:
      - lambda: id(board_view) = overhead::View::RADAR;
      - script.execute: redraw_board

script:
  - id: redraw_board
    then:
      - wait_until:
          condition:
            lambda: return !id(board_display).is_updating();
      - component.update: board_display
  - id: fetch_aircraft
    then:
      - wait_until:
          condition:
            lambda: return !id(board_display).is_updating();
      - if:
          condition:
            and:
              - wifi.connected
              - lambda: |-
                  const auto now = id(flight_clock).utcnow();
                  if (!now.is_valid() || !id(poll_schedule).record_attempt(uint64_t(now.timestamp) * 1000)) {
                    return false;
                  }
                  if (id(poll_storage).save(&id(poll_schedule)) && global_preferences->sync()) return true;
                  ESP_LOGW("overhead", "Unable to save flight request budget");
                  return false;
          then:
            - http_request.get:
                url: !lambda |-
                  return "https://api.adsb.lol/v2/point/" +
                         std::to_string(double(${home_latitude})) + "/" +
                         std::to_string(double(${home_longitude})) + "/${radius_nm}";
                capture_response: true
                collect_headers:
                  - Retry-After
                max_response_buffer_size: 65536
                on_response:
                  - lambda: |-
                      auto &flights = id(aircraft);
                      auto &status = id(board_status);
                      flights.clear();
                      if (response->status_code != 200) {
                        if (response->status_code == 429) {
                          status = "Feed quota reached";
                          const auto now = uint64_t(id(flight_clock).timestamp_now()) * 1000;
                          id(poll_schedule).rate_limited(now, response->get_response_header("Retry-After"));
                          if (!id(poll_storage).save(&id(poll_schedule)) || !global_preferences->sync()) {
                            ESP_LOGW("overhead", "Unable to save flight quota wait");
                          }
                        } else {
                          status = "Flight feed unavailable";
                        }
                        return;
                      }

                      const bool valid = json::parse_json(body, [&](JsonObject root) {
                        const auto aircraft = root["ac"].as<JsonArrayConst>();
                        if (aircraft.isNull()) {
                          return root["total"].is<int>() && root["total"].as<int>() == 0;
                        }

                        for (JsonObjectConst plane : aircraft) {
                          if (!plane["lat"].is<double>() || !plane["lon"].is<double>() ||
                              !plane["seen_pos"].is<double>() || plane["seen_pos"].as<double>() > 30 ||
                              std::string(plane["alt_baro"] | "") == "ground") {
                            continue;
                          }

                          const auto latitude = plane["lat"].as<double>();
                          const auto longitude = plane["lon"].as<double>();
                          if (!(latitude >= -90 && latitude <= 90 && longitude >= -180 && longitude <= 180)) {
                            continue;
                          }
                          const auto position = overhead::relative_position(
                              ${home_latitude}, ${home_longitude}, latitude, longitude);
                          if (position.distance_nm > ${radius_nm}) {
                            continue;
                          }

                          std::string label = plane["flight"] | "";
                          const auto end = label.find_last_not_of(' ');
                          label = end == std::string::npos ? "" : label.substr(0, end + 1);
                          const auto airline = overhead::airline_for(label);
                          if (label.empty()) label = plane["r"] | "";
                          if (label.empty()) label = plane["hex"] | "-";

                          overhead::Aircraft flight{position, label, plane["t"] | "-", {}, {}, {}, airline};
                          if (plane["alt_baro"].is<int>()) flight.altitude_ft = plane["alt_baro"].as<int>();
                          if (plane["gs"].is<double>()) flight.speed_kt = std::lround(plane["gs"].as<double>());
                          if (plane["track"].is<double>()) {
                            const auto track = plane["track"].as<double>();
                            if (track >= 0 && track < 360) flight.ground_track = track;
                          }
                          flights.push_back(std::move(flight));
                        }
                        std::sort(flights.begin(), flights.end());
                        return true;
                      });
                      status = valid ? "" : "Invalid flight data";
                      if (valid) {
                        ESP_LOGI("overhead", "Flight board received %u nearby aircraft",
                                 static_cast<unsigned>(flights.size()));
                      }
                on_error:
                  - lambda: |-
                      id(aircraft).clear();
                      id(board_status) = "Flight feed unavailable";
            - lambda: |-
                const auto now = uint64_t(id(flight_clock).timestamp_now()) * 1000;
                id(poll_schedule).finish(now, id(board_status).empty() && !id(aircraft).empty());
            - script.execute: redraw_board

font:
  - file: "gfonts://IBM Plex Mono"
    id: label_font
    size: 15
  - file: "gfonts://Inter@700"
    id: title_font
    size: 48
  - file: "gfonts://Inter@700"
    id: callsign_font
    size: 26
  - file: "gfonts://Inter@700"
    id: spotlight_font
    size: 44
  - file: "gfonts://Inter@700"
    id: distance_font
    size: 70
  - file: "gfonts://Inter@700"
    id: value_font
    size: 22

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    model: Seeed-reTerminal-E1001
    id: board_display
    update_interval: never
    full_update_every: 12
    lambda: |-
      const auto ink = Color::BLACK;
      const auto paper = Color::WHITE;
      const auto &flights = id(aircraft);
      const auto &status = id(board_status);
      const auto view = id(board_view);
      constexpr double range_nm = ${radius_nm};

      it.print(28, 12, id(title_font), ink, "Overbird");
      if (status.empty()) {
        it.printf(772, 20, id(value_font), ink, TextAlign::TOP_RIGHT, "%u aircraft",
                  static_cast<unsigned>(flights.size()));
      }
      it.printf(772, 52, id(label_font), ink, TextAlign::TOP_RIGHT, "%g NM RADIUS", range_nm);
      it.horizontal_line(28, 86, 744, ink);
      it.horizontal_line(28, 438, 744, ink);
      const char *tabs[] = {"RADAR", "SPOTLIGHT", "FLIGHT CARDS"};
      const int tab_x[] = {478, 548, 650};
      const int tab_width[] = {65, 98, 122};
      for (int i = 0; i < static_cast<int>(overhead::View::COUNT); ++i) {
        const bool active = i == static_cast<int>(view);
        if (active) it.filled_rectangle(tab_x[i], 447, tab_width[i], 24, ink);
        it.print(tab_x[i] + tab_width[i] / 2, 449, id(label_font), active ? paper : ink,
                 TextAlign::TOP_CENTER, tabs[i]);
      }

      if (!status.empty() || (flights.empty() && view != overhead::View::RADAR)) {
        it.print(400, 226, id(callsign_font), ink, TextAlign::TOP_CENTER,
                 status.empty() ? "No aircraft in range" : status.c_str());
        return;
      }

      const auto altitude = [](const overhead::Aircraft &flight) {
        if (!flight.altitude_ft) return std::string("-");
        auto value = std::to_string(*flight.altitude_ft);
        const size_t start = value.front() == '-' ? 1 : 0;
        for (size_t i = value.size(); i > start + 3; i -= 3) value.insert(i - 3, ",");
        return value;
      };
      const auto speed = [](const overhead::Aircraft &flight) {
        return flight.speed_kt ? std::to_string(*flight.speed_kt) : std::string("-");
      };
      const auto overflow = [&](size_t shown) {
        if (flights.size() > shown) {
          it.printf(772, 414, id(label_font), ink, TextAlign::TOP_RIGHT, "+%u more",
                    static_cast<unsigned>(flights.size() - shown));
        }
      };
      constexpr int jet_half_widths[] = {
        0, 1, 2, 2, 2, 2, 2, 2, 3, 5, 7, 9, 11, 11, 9, 7, 2, 2, 2, 2, 2, 4, 6, 6, 2
      };
      const auto draw_jet = [&](int x, int y, int scale, int outline, Color color) {
        const auto stroke = [&](int left, int top, int width, int height) {
          it.filled_rectangle(x + left * scale - outline, y + top * scale - outline,
                              width * scale + 2 * outline, height * scale + 2 * outline, color);
        };
        for (int row = 0; row < 25; ++row) {
          const int half_width = jet_half_widths[row];
          stroke(-half_width, row - 12, 2 * half_width + 1, 1);
        }
        // Wing-mounted engines leave a gap on each side of the fuselage.
        stroke(-7, 2, 3, 5);
        stroke(5, 2, 3, 5);
      };
      const auto show_airline = [&](int x, int y, Color color, const overhead::Aircraft &flight) {
        if (!flight.airline.empty()) {
          it.printf(x, y, id(label_font), color, "%.*s", int(flight.airline.size()), flight.airline.data());
        }
      };

      if (view == overhead::View::RADAR) {
        constexpr int cx = 245, cy = 265, radius = 128;
        it.filled_rectangle(28, 104, 434, 320, ink);
        it.circle(cx, cy, radius, paper);
        it.circle(cx, cy, radius - 1, paper);
        it.circle(cx, cy, radius / 2, paper);
        it.print(cx, 106, id(label_font), paper, TextAlign::TOP_CENTER, "N");
        it.print(cx, 404, id(label_font), paper, TextAlign::TOP_CENTER, "S");
        it.print(79, cy, id(label_font), paper, TextAlign::CENTER, "W");
        it.print(411, cy, id(label_font), paper, TextAlign::CENTER, "E");

        for (int offset = -radius + 5; offset < radius; offset += 7) {
          it.horizontal_line(cx + offset, cy, 2, paper);
          it.vertical_line(cx, cy + offset, 2, paper);
        }
        for (int degrees = 15; degrees < 360; degrees += 15) {
          if (degrees % 90 == 0) continue;
          const double angle = degrees * overhead::RADIANS_PER_DEGREE;
          const int x = cx + std::lround((radius - 6) * std::sin(angle));
          const int y = cy - std::lround((radius - 6) * std::cos(angle));
          it.filled_circle(x, y, 1, paper);
        }
        it.horizontal_line(cx - 5, cy, 11, paper);
        it.vertical_line(cx, cy - 5, 11, paper);
        it.printf(45, 390, id(label_font), paper, "%g NM RINGS", range_nm / 2);

        if (flights.empty()) {
          it.print(484, 232, id(callsign_font), ink, "No aircraft in range");
          return;
        }

        const auto show_number = [&](int x, int y, unsigned number, Color foreground, Color background) {
          it.filled_rectangle(x - 6, y - 8, 13, 17, background);
          it.printf(x, y, id(label_font), foreground, TextAlign::CENTER, "%u", number);
        };
        const auto numbered_plane = [&](int x, int y, unsigned number, Color foreground, Color background) {
          draw_jet(x, y, 1, 0, foreground);
          show_number(x + 18, y, number, foreground, background);
        };
        const auto show_ground_track = [&](int x, int y, std::optional<double> track) {
          if (!track) {
            it.filled_circle(x, y, 7, ink);
            it.circle(x, y, 4, paper);
            return;
          }

          // Sample the north-facing silhouette in reverse to avoid holes when rotating.
          // Keep its outline inside the same bounds used to place the numbered markers.
          const double angle = *track * overhead::RADIANS_PER_DEGREE;
          const double cosine = std::cos(angle), sine = std::sin(angle);
          bool pixels[25][23] = {};
          for (int row = -12; row <= 12; ++row) {
            for (int column = -11; column <= 11; ++column) {
              const int sx = std::lround(column * cosine + row * sine);
              const int sy = std::lround(row * cosine - column * sine);
              const bool body = sy >= -12 && sy <= 12 && std::abs(sx) <= jet_half_widths[sy + 12];
              const bool engine = sy >= 2 && sy <= 6 && std::abs(sx) >= 5 && std::abs(sx) <= 7;
              pixels[row + 12][column + 11] = body || engine;
            }
          }
          for (int halo : {1, 0}) {
            for (int row = 0; row < 25; ++row) {
              int start = 0;
              for (int column = 0; column <= 23; ++column) {
                if (column < 23 && pixels[row][column]) continue;
                if (column > start) {
                  it.filled_rectangle(x + start - 11 - halo, y + row - 12 - halo,
                                      column - start + 2 * halo, 1 + 2 * halo, halo ? ink : paper);
                }
                start = column + 1;
              }
            }
          }
        };

        struct ScopePoint { int x; int y; };
        struct ScopeBounds {
          int left, top, right, bottom;
          bool intersects(const ScopeBounds &other) const {
            return left <= other.right && right >= other.left && top <= other.bottom && bottom >= other.top;
          }
          bool shares_line(const ScopeBounds &other) const {
            return (left == right && other.left == other.right && left == other.left &&
                    std::min(bottom, other.bottom) > std::max(top, other.top)) ||
                   (top == bottom && other.top == other.bottom && top == other.top &&
                    std::min(right, other.right) > std::max(left, other.left));
          }
        };
        struct Marker {
          ScopePoint icon;
          int label_offset;
          ScopeBounds bounds;
          ScopeBounds leader;
        };
        const auto on_scope = [&](const overhead::Position &position) {
          const double length = radius * std::clamp(position.distance_nm / range_nm, 0.0, 1.0);
          return ScopePoint{
            cx + int(std::lround(length * std::sin(position.bearing_radians))),
            cy - int(std::lround(length * std::cos(position.bearing_radians))),
          };
        };
        constexpr size_t max_markers = 4;
        const size_t keyed = std::min(flights.size(), max_markers);
        ScopePoint contacts[max_markers];
        std::optional<Marker> markers[max_markers];
        for (size_t i = 0; i < keyed; ++i) {
          contacts[i] = on_scope(flights[i].position);
        }
        const auto clear = [&](const Marker &candidate, size_t index) {
          if (candidate.bounds.intersects({45, 390, 145, 412})) return false;  // Range caption.
          if (candidate.bounds.intersects({73, 254, 85, 276}) ||
              candidate.bounds.intersects({405, 254, 417, 276})) return false;  // W and E.
          for (size_t i = 0; i < keyed; ++i) {
            if (i == index) continue;
            const auto [x, y] = contacts[i];
            if (candidate.bounds.intersects({x - 2, y - 2, x + 2, y + 2})) return false;
            if (markers[i] && (candidate.bounds.intersects(markers[i]->bounds) ||
                               candidate.bounds.intersects(markers[i]->leader) ||
                               candidate.leader.intersects(markers[i]->bounds) ||
                               candidate.leader.shares_line(markers[i]->leader))) return false;
          }
          return true;
        };
        const auto find_marker = [&](size_t i) -> std::optional<Marker> {
          const auto [x, y] = contacts[i];
          for (const int gap : {0, 29, 24, 16, 58, 87, 116, 145, 174, 203, 232}) {
            const ScopePoint candidates[] = {{x, y - gap}, {x, y + gap}, {x - gap, y}, {x + gap, y}};
            for (const auto [mx, my] : candidates) {
              if (std::abs(mx - cx) > radius + 16 || std::abs(my - cy) > radius) continue;
              for (const int side : {1, -1}) {
                if ((mx - x) * side < 0) continue;  // Put the number away from a horizontal leader.
                const Marker marker{{mx, my}, side * 18,
                                    {mx - (side < 0 ? 24 : 12), my - 13,
                                     mx + (side > 0 ? 24 : 12), my + 13},
                                    {std::min(x, mx), std::min(y, my),
                                     std::max(x, mx), std::max(y, my)}};
                if (clear(marker, i)) return marker;
              }
            }
          }
          return std::nullopt;
        };
        // Earlier placements can box in a later contact. Try the other priority
        // orders before moving any contact to the margin.
        size_t order[] = {0, 1, 2, 3};
        std::optional<Marker> best[max_markers];
        size_t placed = 0;
        do {
          std::fill(markers, markers + keyed, std::nullopt);
          size_t count = 0;
          for (size_t j = 0; j < keyed; ++j) {
            const size_t i = order[j];
            markers[i] = find_marker(i);
            count += markers[i].has_value();
          }
          if (count > placed) {
            std::copy(markers, markers + keyed, best);
            placed = count;
          }
          if (placed == keyed) break;
        } while (std::next_permutation(order, order + keyed));
        std::copy(best, best + keyed, markers);

        ScopePoint margin_markers[max_markers];
        bool margin_used[max_markers] = {};
        for (size_t i = keyed; i < flights.size(); ++i) {
          const auto [x, y] = on_scope(flights[i].position);
          it.filled_circle(x, y, 4, ink);
          it.filled_circle(x, y, 2, paper);
        }
        for (size_t i = 0; i < keyed; ++i) {
          const auto [x, y] = contacts[i];
          if (!markers[i]) {
            size_t slot = (y - 104) / 81;
            while (margin_used[slot]) slot = (slot + 1) % max_markers;
            margin_used[slot] = true;
            margin_markers[i] = {435, 144 + 81 * int(slot)};
            const auto [mx, my] = margin_markers[i];
            it.vertical_line(x, std::min(y, my), std::abs(y - my) + 1, paper);
            it.horizontal_line(x, my, mx - x + 1, paper);
            it.filled_circle(x, y, 2, paper);
            continue;
          }
          const auto [mx, my] = markers[i]->icon;
          if (x == mx && y == my) continue;
          const auto &leader = markers[i]->leader;
          it.filled_rectangle(leader.left, leader.top, leader.right - leader.left + 1,
                              leader.bottom - leader.top + 1, paper);
          it.filled_circle(x, y, 2, paper);
        }
        for (size_t i = 0; i < keyed; ++i) {
          const auto [x, y] = markers[i] ? markers[i]->icon : margin_markers[i];
          const int label_offset = markers[i] ? markers[i]->label_offset : 18;
          show_ground_track(x, y, flights[i].ground_track);
          show_number(x + label_offset, y, static_cast<unsigned>(i + 1), paper, ink);
        }

        const auto &closest = flights.front();
        it.rectangle(484, 104, 288, 162, ink);
        it.filled_rectangle(484, 104, 288, 33, ink);
        numbered_plane(505, 120, 1, paper, ink);
        it.print(534, 110, id(label_font), paper, "CLOSEST AIRCRAFT");
        it.printf(758, 110, id(label_font), paper, TextAlign::TOP_RIGHT,
                  "%.1f NM", closest.position.distance_nm);
        it.printf(498, 142, id(callsign_font), ink, "%.10s", closest.callsign.c_str());
        if (closest.airline.empty()) {
          it.printf(498, 176, id(label_font), ink, "%.6s", closest.type.c_str());
        } else {
          show_airline(498, 176, ink, closest);
          it.printf(758, 176, id(label_font), ink, TextAlign::TOP_RIGHT, "%.6s", closest.type.c_str());
        }
        it.horizontal_line(498, 201, 260, ink);
        it.print(498, 209, id(label_font), ink, "ALT FT");
        it.print(758, 209, id(label_font), ink, TextAlign::TOP_RIGHT, "SPD KT");
        it.print(498, 229, id(value_font), ink, altitude(closest).c_str());
        it.print(758, 229, id(value_font), ink, TextAlign::TOP_RIGHT, speed(closest).c_str());
        if (keyed > 1) {
          it.print(484, 274, id(label_font), ink, "ALSO IN RANGE");
          for (size_t i = 1; i < keyed; ++i) {
            const int y = 299 + 39 * (i - 1);
            it.horizontal_line(484, y - 3, 288, ink);
            numbered_plane(495, y + 11, static_cast<unsigned>(i + 1), ink, paper);
            it.printf(524, y, id(value_font), ink, "%.10s", flights[i].callsign.c_str());
            show_airline(524, y + 18, ink, flights[i]);
            it.printf(772, y + 3, id(label_font), ink, TextAlign::TOP_RIGHT,
                      "%.1f NM", flights[i].position.distance_nm);
          }
        }
        overflow(keyed);
        return;
      }

      if (view == overhead::View::SPOTLIGHT) {
        const auto &closest = flights.front();
        it.filled_rectangle(28, 104, 456, 320, ink);
        it.print(51, 124, id(label_font), paper, "CLOSEST AIRCRAFT");
        it.printf(461, 124, id(label_font), paper, TextAlign::TOP_RIGHT, "%.6s", closest.type.c_str());
        it.printf(48, 146, id(spotlight_font), paper, "%.10s", closest.callsign.c_str());
        show_airline(52, 199, paper, closest);
        it.printf(48, 207, id(distance_font), paper, "%.1f", closest.position.distance_nm);
        it.print(52, 289, id(label_font), paper, "NAUTICAL MILES AWAY");
        draw_jet(414, 251, 3, 0, paper);
        it.horizontal_line(51, 326, 410, paper);
        it.print(51, 342, id(label_font), paper, "ALTITUDE FT");
        it.print(255, 342, id(label_font), paper, "GROUND SPEED KT");
        it.print(51, 366, id(value_font), paper, altitude(closest).c_str());
        it.print(255, 366, id(value_font), paper, speed(closest).c_str());

        if (flights.size() == 1) {
          it.print(514, 122, id(label_font), ink, "DISTANCE FROM HERE");
